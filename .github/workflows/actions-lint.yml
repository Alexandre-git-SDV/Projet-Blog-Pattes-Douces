name: Actions & CI Files

on:
  push:
    branches: [main, development]
    paths: &ci-files
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main, development]
    paths: *ci-files
  schedule:
    - cron: '0 5 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Lint workflows (actionlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # lire les workflows
      pull-requests: write # commenter la PR (reporter github-pr-review)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1.79.1
        with:
          reporter: github-pr-review

  zizmor:
    name: Security scan (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read # lire les workflows
      actions: read # lire les metadonnees des workflows
      security-events: write # publier les resultats dans l'onglet Security

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
