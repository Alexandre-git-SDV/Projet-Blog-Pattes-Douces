name: Actions & CI Files

on:
  push:
    branches: [main, development]
    paths: &ci-files
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main, development]
    paths: *ci-files
  schedule:
    - cron: '0 5 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Lint workflows (actionlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # lire les workflows
      pull-requests: write # commenter la PR (reporter github-pr-review)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499 # v1.80.4
        with:
          reporter: github-pr-review

  zizmor:
    name: Security scan (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read # lire les workflows
      actions: read # lire les metadonnees des workflows
      security-events: write # publier les resultats dans l'onglet Security

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
