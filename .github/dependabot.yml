version: 2

updates:
  # Dépendances applicatives (pnpm-lock.yaml est auto-détecté par l'écosystème "npm")
  - package-ecosystem: 'npm'
    directory: '/blog-pattes-douces'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # N'adopter une version qu'après 7 jours (laisse le temps aux correctifs
    # et limite le risque de paquet compromis).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore (deps) :'
      prefix-development: 'chore (deps-dev) :'
    groups:
      # Minor/patch groupés par lot pour limiter le nombre de PR (et donc
      # d'exécutions CI) ; les majeures restent individuelles pour revue.
      production-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      development-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    ignore:
      # Majeures à valider manuellement avant adoption : elles peuvent casser
      # lint/build tant qu'eslint-config-next ne les supporte pas.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Actions utilisées dans .github/workflows/*.yml
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # N'adopter une version qu'après 7 jours (laisse le temps aux correctifs
    # et limite le risque de paquet compromis).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'ci'
      - 'dependencies'
    commit-message:
      prefix: 'CI (deps) :'
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
