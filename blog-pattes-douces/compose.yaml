# Environnement local de Pattes Douces.
#
#  - Installation pnpm   : seule la base est lancee par Docker
#      docker compose up -d --wait            (= pnpm db:up)
#  - Installation Docker : base + creation des index + application
#      docker compose --profile app up -d --build --wait
#
# Ports deja pris ? MONGO_PORT=27019 / APP_PORT=3005 devant la commande.
# BLOB_READ_WRITE_TOKEN est lu dans le fichier .env (necessaire pour publier).

x-database-url: &database-url mongodb://mongo:27017/pattes-douces?replicaSet=rs0&directConnection=true

services:
  # MongoDB 8.0 en replica set : Prisma en a besoin pour ecrire (transactions).
  # Le healthcheck initialise le replica set "rs0" au premier demarrage.
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  # Cree les index (pseudo et email uniques) puis s'arrete.
  db-init:
    profiles: ["app"]
    build:
      context: .
      target: deps
    command: ["./node_modules/.bin/prisma", "db", "push", "--skip-generate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      mongo:
        condition: service_healthy

  # L'application Next.js (build de production).
  app:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: *database-url
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      # Repond seulement si le serveur ET la base sont joignables.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/articles').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
